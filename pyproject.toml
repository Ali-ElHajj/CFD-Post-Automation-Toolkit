[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfxpost-toolkit"
version = "1.0.0"
description = "Reusable CFX-Post automation and thermal-comfort post-processing toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pythermalcomfort==3.8.0",
    "psychrolib",
    "pywin32; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]
